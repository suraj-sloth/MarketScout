# Web sources TinyFish reads (planning.md §3). Adding a source = adding an entry.
#
# kind:      outside_view | news | agent_check
# priority:  high | normal | low (default normal). High runs first in every
#            cycle; refresh intervals per priority are in config.py.
# schema:    short notation (str | int | float, {...}, [...]). Described in the
#            goal and checked on every result.
# strict_schema: true to also send it as TinyFish's `output_schema`. Off by
#            default: it made the Polymarket page check return empty lists.
# max_duration_seconds: optional; TinyFish stops the run itself after this.
# allow_empty: true if an empty list is a real answer (news: no articles).
#              Otherwise empty lists are rejected and the cached reading is kept.
#
# Only use sites that load normally; skip any that block automated access.

- id: fedwatch
  kind: outside_view
  priority: high
  max_duration_seconds: 240
  event: fed-dec
  url: https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html
  goal: >
    For the next FOMC meeting, return the meeting date (YYYY-MM-DD) and the
    probability of each target rate range in basis points, as shown in the
    probability table.
  schema:
    meeting_date: str
    probabilities: [{range_bps: str, prob: float}]

- id: pm_page_fed
  kind: agent_check
  priority: high
  max_duration_seconds: 180
  event: fed-dec
  url: https://polymarket.com/event/fed-decision-in-december-20260729232808632
  goal: >
    Return each outcome shown on this page and its displayed probability as a
    number between 0 and 1.
  schema:
    outcomes: [{name: str, prob: float}]

- id: news_cnbc_fed
  name: CNBC
  kind: news
  allow_empty: true
  priority: normal
  max_duration_seconds: 300
  event: fed-dec
  url: https://www.cnbc.com/federal-reserve/
  goal: >
    List up to 5 articles from the last 48h about the Federal Reserve's next
    rate decision. For each: headline, URL, published time (UTC ISO 8601),
    whether it makes a 25 bps rate HIKE at the December 2026 meeting more
    likely (1), less likely (-1) or is neutral (0), and a one-sentence reason
    quoting the article.
  schema:
    items: [{headline: str, url: str, published_at: str, direction: int, reason: str}]

- id: news_coindesk_btc
  name: CoinDesk
  kind: news
  allow_empty: true
  priority: normal
  max_duration_seconds: 300
  event: btc-150k-dec
  url: https://www.coindesk.com/markets
  goal: >
    List up to 5 articles from the last 48h about the Bitcoin price outlook.
    For each: headline, URL, published time (UTC ISO 8601), whether it makes
    Bitcoin reaching $150,000 by December 31, 2026 more likely (1), less
    likely (-1) or is neutral (0), and a one-sentence reason quoting the
    article.
  schema:
    items: [{headline: str, url: str, published_at: str, direction: int, reason: str}]

- id: news_cnbc_shutdown
  name: CNBC
  kind: news
  allow_empty: true
  priority: normal
  max_duration_seconds: 300
  event: gov-shutdown-dec
  url: https://www.cnbc.com/politics/
  goal: >
    List up to 5 articles from the last 48h about US government funding or a
    possible government shutdown. For each: headline, URL, published time
    (UTC ISO 8601), whether it makes a US government shutdown by December 31,
    2026 more likely (1), less likely (-1) or is neutral (0), and a
    one-sentence reason quoting the article.
  schema:
    items: [{headline: str, url: str, published_at: str, direction: int, reason: str}]
